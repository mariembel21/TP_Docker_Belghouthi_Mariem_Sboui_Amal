name: CI/CD Pipeline Docker

# Se déclenche automatiquement à chaque push sur main
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v3

      # 2. Configuration de Python
      - name: Configuration de Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. ÉTAPE 1 DU TP : Installation et Tests Unitaires
      - name: Tests Unitaires Python
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python -m unittest discover -s app -p "test_*.py"

      # 4. Connexion sécurisée à Docker Hub
      - name: Connexion à Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. ÉTAPE 2 DU TP : Build et Push sur Docker Hub
      - name: Build et Push Image Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: mariembelghouthi/counter-app:latest